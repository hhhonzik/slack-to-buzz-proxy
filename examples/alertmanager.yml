# Replace the URL and token. Protect this file as a secret.
# Alertmanager does not expand environment variables in this YAML.
route:
  receiver: buzz
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: buzz
    slack_configs:
      - api_url: 'https://buzz-proxy.example.com/hooks/alerts/REPLACE_WITH_WEBHOOK_TOKEN'
        channel: '#alerts' # Buzz destination is fixed by the proxy route.
        send_resolved: true
        title: '[{{ .Status | toUpper }}:{{ .Alerts | len }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Labels.alertname }}*
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        mrkdwn_in: [text, pretext, fields]

# Alternatively put the complete URL in a mounted file and replace api_url
# with api_url_file: /run/secrets/buzz-webhook-url
